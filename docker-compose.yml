services:
  voice_commander_app:
    build:
      context: ./container
      dockerfile: Dockerfile
    container_name: voice_commander_app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST_RUNNER_URL=http://host.docker.internal:8001
      - HOST_API_TOKEN=my_secure_voice_token_123
    volumes:
      - ./container:/app:z
      - /app/models
      - /app/voices
    restart: unless-stopped
